{% extends "base.html" %}
{% block title %}Create account — SignBridge{% endblock %}
{% block content %}
<div class="auth-card card">
  <h2>Create your account</h2>
  <form method="post" class="form">
    <label><span>Full name</span><input type="text" name="display_name" required autocomplete="name"></label>
    <label><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
    <label><span>Password</span><input type="password" name="password" minlength="8" required autocomplete="new-password"></label>
    <fieldset class="roles">
      <legend>I am a…</legend>
      <label class="role"><input type="radio" name="role" value="patient" checked> Patient</label>
      <label class="role"><input type="radio" name="role" value="doctor"> Doctor / hospital staff</label>
    </fieldset>
    <button class="btn btn--primary btn--block" type="submit">Create account</button>
  </form>
  <p class="muted small">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</div>
{% endblock %}
