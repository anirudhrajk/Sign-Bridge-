<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}SignBridge{% endblock %}</title>
  <meta name="description" content="SignBridge helps deaf patients and doctors talk clearly: sign language to text, and speech back to sign.">
  <meta name="theme-color" content="#0e6b5e" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script>
    try {
      ['contrast', 'motion', 'large'].forEach(k => {
        if (localStorage.getItem('sb-' + k) === '1') document.documentElement.classList.add('a11y-' + k);
      });
      const t = localStorage.getItem('sb-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
{% include "_icons.html" %}



<div class="public">
  {% block body %}{% endblock %}
</div>

<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
