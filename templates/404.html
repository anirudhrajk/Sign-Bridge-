{% extends "base.html" %}
{% block title %}Page not found · SignBridge{% endblock %}
{% block page_title %}Not found{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">404</div>
  <h2>We couldn't find that page</h2>
  <p class="muted">It may have moved, or you may not have access to it.</p>
  <a href="{{ url_for('views.dashboard') if current_user.is_authenticated else url_for('views.welcome') }}" class="btn btn--primary mt">Go home</a>
</div>
{% endblock %}
