{% extends "base.html" %}
{% block title %}Something went wrong · SignBridge{% endblock %}
{% block page_title %}Error{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">500</div>
  <h2>Something went wrong on our side</h2>
  <p class="muted">Please try again. If it keeps happening, tell your clinic's administrator.</p>
  <a href="{{ url_for('views.dashboard') if current_user.is_authenticated else url_for('views.welcome') }}" class="btn btn--primary mt">Go home</a>
</div>
{% endblock %}
